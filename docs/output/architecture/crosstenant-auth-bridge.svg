<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1420" viewBox="0 0 1900 1420" role="img" aria-labelledby="title desc">
  <title id="title">crosstenant-auth-bridge solution architecture</title>
  <desc id="desc">Reference architecture for cross-tenant, cross-cloud sovereign access from Microsoft 365 GCC Moderate to Azure AI Foundry in Azure Government. SPFx web part in Tenant A acquires an Entra token and calls an Azure Function in Tenant B. The Function validates the token in C# middleware against Tenant A JWKS, rewrites the Foundry audience via ScopedCredential, and calls the Foundry Prompt Agent via Managed Identity.</desc>
  <defs>
    <marker id="arrow-0078D4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0078D4" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-5C2D91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5C2D91" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-0C8599" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0C8599" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-D13438" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#D13438" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1900" height="1420" fill="#FFFFFF"/>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Arial, sans-serif">
    <!-- Header -->
    <text x="60" y="80" font-size="44" font-weight="700" fill="#000000">crosstenant-auth-bridge</text>
    <text x="60" y="120" font-size="25" font-weight="400" fill="#000000">Cross-tenant / cross-cloud AI auth broker | Solution architecture</text>
    <text x="1410" y="72" font-size="19" font-weight="700" fill="#000000">CHECKED-IN IMPLEMENTATION</text>

    <!-- Legend -->
    <polyline points="60,152 112,152" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078D4)"/>
    <text x="126" y="155" font-size="17" font-weight="400" fill="#000000">Content / chat traffic</text>

    <polyline points="330,152 382,152" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-5C2D91)"/>
    <text x="396" y="155" font-size="17" font-weight="400" fill="#000000">Token &amp; API workflow</text>

    <polyline points="610,152 662,152" fill="none" stroke="#D13438" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
    <text x="676" y="155" font-size="17" font-weight="400" fill="#000000">Sovereign / cloud boundary</text>

    <rect x="940" y="141" width="40" height="22" rx="5" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="994" y="155" font-size="17" font-weight="400" fill="#000000">Optional capability</text>

    <!-- ================= TENANT A CONTAINER ================= -->
    <rect x="60" y="180" width="500" height="1060" rx="24" fill="none" stroke="#0078D4" stroke-width="2"/>
    <text x="80" y="215" font-size="19" font-weight="700" fill="#000000">TENANT A: M365 GCC MODERATE (COMMERCIAL ENTRA ID)</text>

    <!-- Tenant A - Component 1: SharePoint Online Web Part -->
    <rect x="90" y="240" width="440" height="310" rx="16" fill="#EFFAFA" stroke="#0C8599" stroke-width="2"/>
    <rect x="115" y="260" width="42" height="36" rx="8" fill="#CCEEEE" stroke="#0C8599" stroke-width="2"/>
    <text x="123" y="283" font-size="16" font-weight="700" fill="#000000">SP</text>
    <text x="170" y="285" font-size="22" font-weight="700" fill="#000000">SharePoint Online</text>
    <text x="115" y="328" font-size="22" font-weight="700" fill="#000000">SPFx React Web Part (v1.24)</text>
    <text x="115" y="365" font-size="17" font-weight="400" fill="#000000">
      <tspan x="115" dy="0">• dallas-permit-chat client UI</tspan>
      <tspan x="115" dy="26">• AadHttpClientFactory token acquisition</tspan>
      <tspan x="115" dy="26">• Scope: api://&lt;apiClientId&gt;/access_as_user</tspan>
      <tspan x="115" dy="26">• Calls POST /api/chat with Bearer JWT</tspan>
      <tspan x="115" dy="26">• Transparent SSO, zero secondary login</tspan>
      <tspan x="115" dy="26">• Property pane: endpoint &amp; App ID config</tspan>
    </text>

    <!-- Tenant A - Component 2: Entra ID Authority -->
    <rect x="90" y="600" width="440" height="280" rx="16" fill="#EDF6FD" stroke="#0078D4" stroke-width="2"/>
    <rect x="115" y="620" width="42" height="36" rx="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
    <text x="126" y="643" font-size="16" font-weight="700" fill="#000000">ID</text>
    <text x="170" y="645" font-size="22" font-weight="700" fill="#000000">Microsoft Entra ID</text>
    <text x="115" y="688" font-size="22" font-weight="700" fill="#000000">Token Authority (Tenant A)</text>
    <text x="115" y="725" font-size="17" font-weight="400" fill="#000000">
      <tspan x="115" dy="0">• App registration with exposed API scope</tspan>
      <tspan x="115" dy="26">• Issues signed Bearer JWT to caller</tspan>
      <tspan x="115" dy="26">• Audience: api://&lt;apiClientId&gt;</tspan>
      <tspan x="115" dy="26">• Public JWKS: login.microsoftonline.com</tspan>
      <tspan x="115" dy="26">• Zero cross-tenant directory peering required</tspan>
    </text>

    <!-- Tenant A - Component 3: Client Identity Context -->
    <rect x="90" y="930" width="440" height="270" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <rect x="115" y="950" width="42" height="36" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <text x="122" y="973" font-size="16" font-weight="700" fill="#000000">USR</text>
    <text x="170" y="975" font-size="22" font-weight="700" fill="#000000">Caller Identity Claims</text>
    <text x="115" y="1018" font-size="22" font-weight="700" fill="#000000">End-User Security Context</text>
    <text x="115" y="1055" font-size="17" font-weight="400" fill="#000000">
      <tspan x="115" dy="0">• Claims carry: oid, upn, name, scp</tspan>
      <tspan x="115" dy="26">• M365 GCC user identity preserved in token</tspan>
      <tspan x="115" dy="26">• Auditable user actions across boundaries</tspan>
      <tspan x="115" dy="26">• No shared service accounts on client side</tspan>
    </text>

    <!-- ================= SOVEREIGN BOUNDARY (VERTICAL DIVIDER) ================= -->
    <line x1="585" y1="180" x2="585" y2="1240" stroke="#D13438" stroke-width="2.5" stroke-dasharray="8 6"/>
    
    <!-- Boundary Pill Tag -->
    <rect x="545" y="940" width="80" height="230" rx="12" fill="#FFF1F2" stroke="#D13438" stroke-width="2"/>
    <text x="585" y="975" font-size="14" font-weight="700" fill="#D13438" text-anchor="middle">SOVEREIGN</text>
    <text x="585" y="995" font-size="14" font-weight="700" fill="#D13438" text-anchor="middle">BOUNDARY</text>
    <text x="585" y="1030" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">M365 GCC</text>
    <text x="585" y="1055" font-size="18" font-weight="700" fill="#D13438" text-anchor="middle">◄──►</text>
    <text x="585" y="1080" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">AZURE GOV</text>
    <text x="585" y="1120" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">No B2B sync</text>
    <text x="585" y="1135" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">No secrets</text>

    <!-- ================= TENANT B CONTAINER ================= -->
    <rect x="610" y="180" width="1230" height="1060" rx="24" fill="none" stroke="#0078D4" stroke-width="2"/>
    <text x="640" y="215" font-size="19" font-weight="700" fill="#000000">TENANT B: AZURE GOVERNMENT / COMMERCIAL (AI WORKLOAD)</text>

    <!-- Tenant B - Component 1: Azure Function Container -->
    <rect x="640" y="240" width="1170" height="465" rx="20" fill="none" stroke="#5C2D91" stroke-width="2"/>
    <rect x="665" y="260" width="42" height="36" rx="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
    <text x="673" y="283" font-size="16" font-weight="700" fill="#000000">FN</text>
    <text x="720" y="285" font-size="24" font-weight="700" fill="#000000">Azure Functions</text>
    <text x="720" y="312" font-size="17" font-weight="400" fill="#64748B">crosstenant-auth-bridge | .NET 8/9 Isolated Worker | In-Code Auth Broker</text>

    <!-- Step 1: JwtAuthenticationMiddleware -->
    <rect x="665" y="335" width="360" height="240" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2"/>
    <text x="685" y="370" font-size="20" font-weight="700" fill="#000000">1  JwtAuthMiddleware</text>
    <text x="685" y="398" font-size="16" font-weight="700" fill="#5C2D91">In-Code Bearer Validation</text>
    <text x="685" y="430" font-size="15" font-weight="400" fill="#000000">
      <tspan x="685" dy="0">• Intercepts POST /api/chat</tspan>
      <tspan x="685" dy="23">• Fetches Tenant A keys from JWKS</tspan>
      <tspan x="685" dy="23">• Validates Signature, Issuer, Audience</tspan>
      <tspan x="685" dy="23">• Bypasses Easy Auth directory lock</tspan>
      <tspan x="685" dy="23">• Sets authenticated HttpContext.User</tspan>
    </text>

    <!-- Step 2: ChatFunction -->
    <rect x="1050" y="335" width="360" height="240" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2"/>
    <text x="1070" y="370" font-size="20" font-weight="700" fill="#000000">2  ChatFunction</text>
    <text x="1070" y="398" font-size="16" font-weight="700" fill="#5C2D91">POST /api/chat Endpoint</text>
    <text x="1070" y="430" font-size="15" font-weight="400" fill="#000000">
      <tspan x="1070" dy="0">• Extracts caller identity (oid, upn)</tspan>
      <tspan x="1070" dy="23">• Manages conversation thread state</tspan>
      <tspan x="1070" dy="23">• Invokes AIProjectClient agent</tspan>
      <tspan x="1070" dy="23">• Adds CORS headers for SharePoint</tspan>
      <tspan x="1070" dy="23">• Returns { conversationId, reply }</tspan>
    </text>

    <!-- Step 3: ScopedCredential -->
    <rect x="1435" y="335" width="350" height="240" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2"/>
    <text x="1455" y="370" font-size="20" font-weight="700" fill="#000000">3  ScopedCredential</text>
    <text x="1455" y="398" font-size="16" font-weight="700" fill="#5C2D91">Sovereign Scope Rewrite</text>
    <text x="1455" y="430" font-size="15" font-weight="400" fill="#000000">
      <tspan x="1455" dy="0">• Wraps DefaultAzureCredential</tspan>
      <tspan x="1455" dy="23">• Rewrites token audience scope:</tspan>
      <tspan x="1455" dy="23" font-weight="700" fill="#5C2D91">  https://ai.azure.us/.default</tspan>
      <tspan x="1455" dy="23">• Overrides SDK default (ai.azure.com)</tspan>
      <tspan x="1455" dy="23">• Target configured via FOUNDRY_SCOPE</tspan>
    </text>

    <!-- Function Internal Security Ribbon -->
    <rect x="665" y="595" width="1120" height="85" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="685" y="625" font-size="15" font-weight="700" fill="#000000">CORS &amp; SECURITY SETTINGS</text>
    <text x="685" y="652" font-size="15" font-weight="400" fill="#000000">Allowed Origins: https://&lt;tenant&gt;.sharepoint.com  |  Access-Control-Allow-Credentials: true  |  Zero stored secrets or client credentials</text>

    <!-- Tenant B - Component 2: Managed Identity -->
    <rect x="665" y="735" width="360" height="255" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <rect x="690" y="755" width="42" height="36" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <text x="701" y="778" font-size="16" font-weight="700" fill="#000000">ID</text>
    <text x="745" y="780" font-size="22" font-weight="700" fill="#000000">Managed Identity</text>
    <text x="690" y="823" font-size="20" font-weight="700" fill="#000000">System-Assigned Identity</text>
    <text x="690" y="860" font-size="16" font-weight="400" fill="#000000">
      <tspan x="690" dy="0">• Function App system-assigned identity</tspan>
      <tspan x="690" dy="24">• Assigned directly on Foundry project</tspan>
      <tspan x="690" dy="24">• RBAC keyless token acquisition</tspan>
      <tspan x="690" dy="24">• Zero secrets stored in code or config</tspan>
      <tspan x="690" dy="24">• Sovereign compliance approved</tspan>
    </text>

    <!-- Tenant B - Component 3: Microsoft Foundry Project -->
    <rect x="1050" y="735" width="450" height="255" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2"/>
    <rect x="1075" y="755" width="42" height="36" rx="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
    <text x="1083" y="778" font-size="16" font-weight="700" fill="#000000">AI</text>
    <text x="1130" y="780" font-size="22" font-weight="700" fill="#000000">Microsoft Foundry</text>
    <text x="1075" y="823" font-size="20" font-weight="700" fill="#000000">Azure AI Foundry Project (Azure Gov)</text>
    <text x="1075" y="860" font-size="16" font-weight="400" fill="#000000">
      <tspan x="1075" dy="0">• Versioned prompt agent (dallas-permit-agent)</tspan>
      <tspan x="1075" dy="24">• Foundry Responses API invocation</tspan>
      <tspan x="1075" dy="24">• System instructions + prompt grounding</tspan>
      <tspan x="1075" dy="24">• Vector search &amp; file search knowledge base</tspan>
      <tspan x="1075" dy="24">• Role: Cognitive Services OpenAI Contributor</tspan>
    </text>

    <!-- Tenant B - Component 4: Monitoring -->
    <rect x="1525" y="735" width="260" height="255" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <rect x="1545" y="755" width="42" height="36" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <text x="1553" y="778" font-size="16" font-weight="700" fill="#000000">MO</text>
    <text x="1600" y="780" font-size="22" font-weight="700" fill="#000000">Monitoring</text>
    <text x="1545" y="823" font-size="20" font-weight="700" fill="#000000">Telemetry &amp; Logs</text>
    <text x="1545" y="860" font-size="16" font-weight="400" fill="#000000">
      <tspan x="1545" dy="0">• Application Insights</tspan>
      <tspan x="1545" dy="24">• Log Analytics workspace</tspan>
      <tspan x="1545" dy="24">• Token &amp; auth tracing</tspan>
      <tspan x="1545" dy="24">• Inference latency tracking</tspan>
      <tspan x="1545" dy="24">• OpenTelemetry ready</tspan>
    </text>

    <!-- Tenant B - Component 5: Optional Private Networking -->
    <rect x="665" y="1010" width="1120" height="130" rx="16" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="690" y="1040" font-size="18" font-weight="700" fill="#000000">OPTIONAL PRIVATE NETWORKING &amp; COMPLIANCE</text>
    <text x="690" y="1070" font-size="16" font-weight="400" fill="#000000">Function outbound VNet integration + Private DNS + Foundry private endpoints (inference &amp; storage accounts).</text>
    <text x="690" y="1098" font-size="15" font-weight="400" fill="#64748B">Keeps all AI inference traffic within sovereign cloud private backbone. Front-door HTTPS protected by Entra JWT validation.</text>

    <!-- ================= WORKFLOW ARROWS ================= -->
    <!-- 1. SPFx to Entra ID (Token Request) -->
    <polyline points="250,550 250,592" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-5C2D91)"/>
    <text x="260" y="578" font-size="14" font-weight="600" fill="#5C2D91">1. Request OAuth token</text>

    <!-- 2. Entra ID to SPFx (Bearer JWT Issued) -->
    <polyline points="370,592 370,558" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-5C2D91)"/>
    <text x="380" y="578" font-size="14" font-weight="600" fill="#5C2D91">2. Return Bearer JWT</text>

    <!-- 3. SPFx across boundary to Function (POST /api/chat) -->
    <polyline points="530,375 657,375" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-0078D4)"/>
    <text x="540" y="360" font-size="15" font-weight="700" fill="#0078D4">3. HTTPS POST /api/chat + Bearer JWT</text>

    <!-- 4. Middleware calls back to Entra ID for JWKS keys -->
    <polyline points="750,575 750,720 538,720" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-5C2D91)"/>
    <text x="548" y="708" font-size="14" font-weight="600" fill="#5C2D91">4. Fetch Tenant A JWKS keys (HTTPS)</text>

    <!-- Internal Function Step 1 -> Step 2 -->
    <polyline points="1025,430 1042,430" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-5C2D91)"/>

    <!-- Internal Function Step 2 -> Step 3 -->
    <polyline points="1410,430 1427,430" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-5C2D91)"/>

    <!-- Function Step 2 to Foundry (Responses API) -->
    <polyline points="1230,575 1230,727" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-5C2D91)" marker-start="url(#arrow-5C2D91)"/>
    <text x="1242" y="650" font-size="15" font-weight="700" fill="#5C2D91">5. Responses API (Chat &amp; RAG)</text>

    <!-- Function Step 3 to Managed Identity -->
    <polyline points="1610,575 1610,715 845,715 845,727" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-64748B)"/>
    <text x="1350" y="708" font-size="14" font-weight="400" fill="#64748B">Acquires token (ai.azure.us scope)</text>

    <!-- Function Step 2 back across boundary to SPFx (Reply) -->
    <polyline points="665,480 538,480" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-0078D4)"/>
    <text x="540" y="505" font-size="15" font-weight="700" fill="#0078D4">6. JSON response { conversationId, reply }</text>

    <!-- Function to Monitoring -->
    <polyline points="1655,575 1655,727" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-64748B)"/>
    <text x="1665" y="650" font-size="14" font-weight="400" fill="#64748B">Telemetry</text>

    <!-- ================= FOOTER NOTES ================= -->
    <text x="60" y="1285" font-size="18" font-weight="400" fill="#000000">Implementation view, not deployment status. Frontend SPFx Web Part runs in Tenant A (M365 GCC Moderate); Azure Function and Foundry run in Tenant B (Azure Government).</text>
    <text x="60" y="1315" font-size="17" font-weight="400" fill="#000000">In-code JWT Bearer validation verifies caller tokens directly against Tenant A's JWKS discovery endpoint without directory peering; ScopedCredential overrides token audience to https://ai.azure.us/.default.</text>
  </g>
</svg>